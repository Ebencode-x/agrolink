version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]
